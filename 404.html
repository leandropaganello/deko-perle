<!DOCTYPE html>
<html lang="de" class="no-js">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Seite nicht gefunden · Deko Perle</title>
  <meta name="description" content="Diese Seite existiert leider nicht. Zurück zur Startseite von Deko Perle." />
  <meta name="robots" content="noindex, follow" />
  <link rel="icon" href="assets/img/favicon-32.png" sizes="32x32" type="image/png" />
  <link rel="stylesheet" href="assets/fonts/fonts.css" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    .error-page { min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 6rem 1.5rem 4rem; }
    .error-code { font-family: 'Cormorant Garamond', serif; font-size: clamp(5rem, 18vw, 11rem); line-height: 1; color: var(--rose-deep); }
  </style>
</head>
<body>
  <a class="skip-link" href="#main">Zum Inhalt springen</a>

  <header class="navbar" id="navbar">
    <nav class="container nav-inner" aria-label="Hauptnavigation">
      <a href="/" class="brand" aria-label="Deko Perle Startseite">
        <img src="/assets/logo-perle.png" alt="" width="48" height="48" />
        <span class="brand-name">Deko Perle</span>
      </a>
    </nav>
  </header>

  <main class="error-page">
    <div class="container">
      <p class="error-code">404</p>
      <h1>Diese Seite gibt es nicht (mehr)</h1>
      <p class="lead" style="max-width:46ch;margin:1rem auto 2.5rem;">
        Der Link ist vielleicht veraltet oder die Adresse wurde falsch eingetippt.
        Hier geht es zurück zu Deko Perle.
      </p>
      <div class="btn-row" style="justify-content:center;">
        <a href="/" class="btn btn-primary">Zur Startseite →</a>
        <a href="/galerie/" class="btn btn-ghost">Zur Galerie</a>
      </div>
    </div>
  </main>
</body>
</html>
